name = "pingflare"
main = "src/index.ts"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[secrets]
required = ["ADMIN_USER", "ADMIN_PASS", "JWT_SECRET", "ENCRYPTION_KEY"]

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./frontend/build"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "pingflare"
database_id = "57c162e7-edab-4cb0-9420-14cc6d630015"
migrations_dir = "drizzle"

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "104142"

[ratelimits.simple]
limit = 5
period = 60

[triggers]
crons = [
  "* * * * *"
]

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
head_sampling_rate = 0.1
persist = false
invocation_logs = false
