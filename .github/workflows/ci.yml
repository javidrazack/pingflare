name: 🔍 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 🔧 Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-backend-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-backend-

      - name: 📦 Install backend dependencies
        run: npm ci

      - name: 🔎 Type-check backend
        run: npx tsc --noEmit

      - name: 🗄️ Smoke-test D1 migration chain
        run: npx wrangler d1 migrations apply DB --local --persist-to /tmp/pingflare-d1-smoke
        env:
          WRANGLER_LOG_PATH: /tmp/pingflare-wrangler-migrations.log

      - name: 🧪 Test alerting and scheduling
        run: npx vitest run src/test/alertManager.test.ts src/test/checkStorage.test.ts src/test/cron.test.ts src/test/cronQueryBudget.test.ts

      - name: 🧪 Test API and infrastructure routes
        if: always()
        run: npx vitest run src/test/backup.test.ts src/test/history.test.ts src/test/infrastructure.test.ts src/test/monitorSecurity.test.ts src/test/notifications.test.ts src/test/publicStatus.test.ts src/test/setBasedRoutes.test.ts

      - name: 🧪 Test migrations and agent installer
        if: always()
        run: npx vitest run src/test/agentInstaller.test.ts src/test/legacyMigrationReconcile.test.ts src/test/migrations.test.ts

      - name: 🧪 Test infrastructure signal formatting
        if: always()
        run: npx vitest run src/test/infrastructureUi.test.ts

      - name: 🧪 Test focused units
        if: always()
        run: npx vitest run src/test/agentStatus.test.ts src/test/analyticsEngine.test.ts src/test/dns.test.ts src/test/http.test.ts src/test/index.test.ts src/test/ping.test.ts src/test/responseCache.test.ts

      - name: 🛡️ Audit backend dependencies
        run: npm audit --audit-level=high

  frontend:
    name: 🎨 Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-

      - name: 📦 Install frontend dependencies
        run: npm ci

      - name: 🔎 Type-check frontend (svelte-check)
        run: npm run check -w frontend

      - name: 🏗️ Build frontend
        run: npm run build -w frontend

      - name: 📦 Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/pingflare-worker
        env:
          WRANGLER_LOG_PATH: /tmp/pingflare-wrangler-dry-run.log

      - name: 🛡️ Audit frontend dependencies
        run: npm audit --workspace frontend --audit-level=high
